name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match versionName in android/app/build.gradle)"
        required: true
        default: "0.2.0"
      notes:
        description: "Release notes"
        required: false
        default: "See README.md for details."

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      
      # The repository has no Gradle wrapper, so install Gradle directly.
      # AGP 8.5.2 requires Gradle 8.7+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.cleanyourmobile-signing
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.cleanyourmobile-signing/release.p12
          test -s ~/.cleanyourmobile-signing/release.p12 || { echo "keystore secret is empty"; exit 1; }
          cat > ~/.cleanyourmobile-signing/keystore.properties <<EOF
          storeFile=$HOME/.cleanyourmobile-signing/release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: gradle -p android publishApkRelease --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$VERSION" CleanYourMobile.apk \
            --title "v$VERSION" \
            --notes "$NOTES"

      # Keep the repository-root APK fresh: README points at it, and it is the
      # one APK deliberately committed (see android/app/build.gradle).
      - name: Commit APK to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CleanYourMobile.apk
          git commit -m "chore: publish CleanYourMobile.apk for v${{ inputs.version }}"
          git push
